name: Web (PWA)

# Phase-2 web verification (plan Task 10):
#  - unit + a11y + the first-route-screen bundle budget on every push/PR;
#  - the Lighthouse mobile budgets (5-run median: LCP/TBT/transfer, plus TTI as
#    a warn assertion) against the built preview on ubuntu-latest — this is the
#    authoritative performance gate (R87);
#  - the Playwright acceptance flow + the built-app service-worker/offline
#    check against the real compose stack, built from the checked-in data
#    pipeline (the data build is slow, so `data/build` is cached by the
#    pipeline/data inputs).
#
# Node is 24 in this workflow while `ci.yml` still uses Node 22: this is the
# first workflow to exercise the Task 10 lockfile under npm 11, so watch the
# first PR run (the lockfile itself was verified with `npm ci --dry-run`).
#
# The E2E job is intentionally heavy: the API and router containers need the
# generated NCR feed, which is gitignored. A cache miss runs the same
# `npm run data:build` chain as local development (download → clip → publish).
# The perf job needs no compose: its only URL is Home, which paints without the
# API.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit, a11y, build budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `npm test` is offline (MSW); the bundle suite skips when `dist/` is
      # absent, so the build step below is what actually enforces the budget.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Build the PWA (emits dist/.vite/manifest.json)
        run: npm run build --workspace @biyahey/web

      - name: Enforce the first route-screen bundle budget
        run: npm test --workspace @biyahey/web -- bundle

  perf:
    name: Lighthouse mobile budgets (built preview)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `perf:web` builds the PWA itself, asserts the build emitted
      # `dist/sw.js` + `dist/manifest.webmanifest`, resolves Playwright's
      # Chromium via `CHROME_PATH`, and runs Lighthouse CI against
      # `vite preview` on :5173 (mobile simulate, 4× CPU, 5 runs, median).
      # Home is the only URL and needs no API, so no compose is started.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Enforce the Lighthouse budgets
        run: npm run perf:web

      # R87: the budgets are authoritative here, not on a shared Windows dev
      # host. A local run under contention is reported as PARTIAL with its
      # measured numbers; it must never be reported as a green budget.
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouseci
          path: apps/web/.lighthouseci/
          if-no-files-found: ignore

  e2e:
    name: Playwright trip flow (real compose stack)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: pipelines/requirements.txt

      - run: npm ci

      - name: Install pinned pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pipelines/requirements.txt

      # data/build is gitignored and contains the ~612 MB Geofabrik extract
      # plus the published feed. Cache it on the pipeline/data inputs so a
      # normal PR does not repeat the download and clip. The key also hashes
      # the data-build entrypoint and `docker-compose.yml` (which pins the
      # routing image version, e.g. `biyahey-routing:2.11.4`) so a pipeline or
      # routing change invalidates the cache instead of silently reusing the
      # previous feed (R86/m5).
      - uses: actions/cache@v4
        id: data-cache
        with:
          path: data/build
          key: biyahey-data-${{ runner.os }}-${{ hashFiles('pipelines/**/*.py', 'pipelines/requirements.txt', 'scripts/data-build.mjs', 'docker-compose.yml', 'data/routes/**', 'data/fares/**', 'data/provenance/**') }}

      - name: Build the NCR dataset (download → clip → publish)
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: npm run data:build
        env:
          PYTHONIOENCODING: utf-8

      - name: Start the compose stack
        run: docker compose up -d --build --wait --wait-timeout 900

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the trip flow against the live BFF
        run: npm run test:e2e
        env:
          VITE_API_URL: http://localhost:8787

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore

      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color --tail=200
