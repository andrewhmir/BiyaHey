<!doctype html>
<html lang="tl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0066eb" />
    <meta
      name="description"
      content="BiyaHey! — plan your Philippine commute on a community-driven, open-source map. Honest fares, honest data."
    />
    <!-- Self-hosted Figtree (see src/theme.css and public/fonts/). Preloading the
         primary latin face removes the old third-party fonts.googleapis.com
         stylesheet from the render-blocking path; the ext face is fetched by the
         browser only if a page needs a glyph outside latin (e.g. ₱). -->
    <link rel="preload" href="/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The map style is fetched by MapCanvas after the shell paints; start it
         in parallel instead of waiting for that chunk's request. -->
    <link rel="preload" href="/map/style.json" as="fetch" crossorigin />
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <link rel="dns-prefetch" href="https://tiles.openfreemap.org" />
    <link rel="icon" type="image/svg+xml" href="/icons/mark.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>BiyaHey! — Philippine community commute map</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
