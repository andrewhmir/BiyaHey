# BiyaHey! curated jeepney / UV Express route inventory - seed (Task 7).
#
# PROVENANCE AND LICENCE
# ----------------------
# Every entry below is transcribed by hand from the OpenStreetMap Wiki list of
# Metro Manila jeepney and UV Express routes:
#
#   https://wiki.openstreetmap.org/wiki/Metro_Manila/Jeepney_and_UV_Express_routes
#
# That page - like the OSM Wiki as a whole - is published under the Creative
# Commons Attribution-ShareAlike 2.0 Generic licence (CC BY-SA 2.0),
# https://creativecommons.org/licenses/by-sa/2.0/ , as stated by the site
# footer on every wiki page. Reuse of this file must therefore keep the
# attribution above and stay under CC BY-SA 2.0 (spec 8.1).
#
# The route *names*, *numbers*, *operators* and *lengths* in it are LTFRB
# material quoted by the OSM Wiki; they are not BiyaHey! inventions.
#
# NOT YET CORROBORATED
# --------------------
# Every entry carries "needs_verification: true". That flag means: transcribed
# from one community-maintained page, not yet checked against a second source
# (an LTFRB memorandum circular, an operator notice, or a field observation).
# Flip an entry to false only when someone has actually done that, and record
# the corroborating source in the commit message.
#
# WHAT IS TRANSCRIBED, AND WHAT IS DELIBERATELY ABSENT
# ---------------------------------------------------
#   code              verbatim from the "Route number" column.
#   name              verbatim from the "Name" column.
#   endpoints         split out of the published name, which LTFRB formats as
#                     "<first endpoint> - <second endpoint> via <roads>".
#   via_roads         the name's "via ..." fragment plus any road sequence in
#                     the "Route description" column, in source order. Empty
#                     when the source names no road.
#   stop_landmarks    ONLY terminals and landmarks the source names in the
#                     route name or the "Route description" column, in travel
#                     order. The wiki publishes no stop-level stop list for
#                     these routes, so neither do we.
#   typical_length_km the "Notes" column where it states a distance; null
#                     otherwise. Never estimated from a map.
#   operator          the "Operator" column verbatim; null when blank. Null
#                     means "not published", not "no operator".
#   headway_peak_min,
#   headway_offpeak_min
#                     ALWAYS null. The wiki publishes no headways, so none are
#                     recorded here. The build falls back to the pinned GTFS
#                     defaults (pipeline/gtfs.py: 4 min peak / 9 min off-peak).
#                     Do not fill these in without a cited source.
#   source_url        the wiki section the row appears in, so a reviewer can
#                     re-check the transcription directly.
#
# Not modelled in this seed at all: LTFRB memorandum circular numbers (some are
# mentioned in the "Notes" column, but a partial set would imply a
# completeness we do not have), stop coordinates (the source has none), and
# fare classes (owned by data/fares/).
#
# Validated by both `npm run validate:data` (schema:
# data/routes/schema/jeepney-inventory.schema.json) and
# pipelines/pipeline/inventory.py.
