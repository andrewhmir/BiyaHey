services:
  routing:
    build:
      context: ./services/routing
      dockerfile: Dockerfile
    image: biyahey-routing:2.11.4
    ports:
      - "8080:8080"
    volumes:
      # Inputs only. `motis import` writes the graph to /var/lib/motis/data in
      # the container, so this mount can stay read-only.
      - ./data/build:/data:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/geocode?text=Cubao"]
      interval: 15s
      timeout: 5s
      retries: 10
      # First start imports the NCR graph before the server listens.
      start_period: 600s
    restart: unless-stopped
