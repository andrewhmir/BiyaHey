# BiyaHey! hand-curated rail fare tables (spec §8.3, ruling R4).
#
# LRT-1 publishes a boarding + per-kilometre formula and is excluded from the
# 2026-03-23 discount. MRT-3 and LRT-2 publish a min-max band that is prorated
# by distance along the line:
#
#   published = round(min + (max - min) * distanceKm / lengthKm)   # whole pesos
#   charged   = published * discount
#
# LRT-2's band is provisional and stays that way (ruling R47): no authoritative
# LRTA per-station fare table could be transcribed from a primary source during
# Plan 1, so the min-max band is secondary-sourced and carries
# `needs_verification: true`. `packages/shared/src/fares.ts` surfaces that as
# `confidence: 'estimated'` plus a "provisional band" fare line, and the phase-1
# acceptance runbook records the gap. Do not describe LRT-2 as an official fare,
# and do not flip this flag without a cited operator table and a test update.
#
# Validated by schema/rail-tables.schema.json via `npm run validate:data`.
source_id: "rail-fares"
source_url: "https://www.lrta.gov.ph/tickets-and-fares/"
currency: "PHP"

lines:
  - id: "lrt1"
    name: "LRT-1"
    operator: "LRMC"
    fare_model: "formula"
    boarding: 16.25
    per_km: 1.47
    effective_from: "2025-04-02"
    confidence: "official"

  - id: "mrt3"
    name: "MRT-3"
    operator: "DOTr–MRT3"
    fare_model: "band"
    min: 13
    max: 28
    length_km: 16.9
    discount: 0.5
    effective_from: "2026-03-23"
    confidence: "estimated"

  - id: "lrt2"
    name: "LRT-2"
    operator: "LRTA"
    fare_model: "band"
    min: 13
    max: 28
    length_km: 13.6
    discount: 0.5
    effective_from: "2026-03-23"
    confidence: "estimated"
    needs_verification: true
    notes: "Provisional band (ruling R47): no authoritative LRTA per-station fare table was available to transcribe, so this is secondary-sourced. Surfaced as confidence: estimated with a provisional-band fare line; do not ship or describe as verified/official."
