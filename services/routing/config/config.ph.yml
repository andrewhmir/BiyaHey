# MOTIS v2.11.4 configuration for the national (PH-wide) routing service.
#
# Provenance: this is the NCR config (`config.yml`) copied and edited with
# exactly two national input paths changed. It is NOT the output of a generator
# run:
#   - `osm: /data/osm/ph.osm.pbf` (the national extract; never clipped)
#   - `timetable.datasets.gtfs.path: /data/gtfs/ph/gtfs/gtfs.zip` (the feed
#     published by `npm run data:build -- --region ph`)
# Everything else - `server.port: 8080`, the absent `tiles:` block, and the
# timetable footpath settings (`extend_missing_footpaths: false`,
# `max_footpath_length: 15`) - is identical to `config.yml`. The footpath
# settings stay identical until Task 4's measured national tuning, so the two
# configs differ only in those two paths for now.
#
# For reference only, the pinned container's generator would name the same
# national inputs as (the doubled `gtfs/` is intentional: publish writes
# `<out>/gtfs/gtfs.zip` under `--out data/build/gtfs/ph`, which is mounted at
# /data):
#     motis config /data/osm/ph.osm.pbf /data/gtfs/ph/gtfs/gtfs.zip
#
# `server.port: 8080` pins the HTTP port (`server.port` is documented in MOTIS
# docs/setup.md - "port (default = 8080)" - and in the starter configs). The
# `tiles:` block is absent on purpose: this service serves routing, geocoding
# and timetable APIs only; map tiles are not part of the MVP and the tiles
# import would dominate import time and memory.
#
# This is the national variant of `config.yml`. It is selected at deploy time
# through the MOTIS_CONFIG environment variable that docker-compose sets (see
# docker-compose.yml):
#     BIYAHEY_ROUTING_CONFIG=/etc/motis/config.ph.yml docker compose up -d routing
#
# Inputs are mounted read-only from ./data/build (see docker-compose.yml). The
# graph is written by `motis import` to the container-local /var/lib/motis/data,
# never into the read-only mount.
server:
  port: 8080

osm: /data/osm/ph.osm.pbf

timetable:
  first_day: TODAY
  num_days: 365
  tb: false
  railviz: true
  with_shapes: true
  adjust_footpaths: true
  merge_dupes_intra_src: false
  merge_dupes_inter_src: false
  link_stop_distance: 100
  update_interval: 60
  http_timeout: 30
  canned_rt: false
  incremental_rt_update: false
  extend_missing_footpaths: false
  max_footpath_length: 15
  default_transfer_time: 2
  max_matching_distance: 25.000000
  preprocess_max_matching_distance: 250.000000
  datasets:
    gtfs:
      path: /data/gtfs/ph/gtfs/gtfs.zip
      extend_calendar: false
      default_bikes_allowed: false
      default_cars_allowed: false
      default_reservation_not_required: true
      clasz_reservation_not_required:
        AIR: false
        COACH: false
        NIGHT: false
        ODM: false
        RIDESHARING: false
elevators: false
street_routing: true
osr_footpath: false
geocoding: true
reverse_geocoding: true
