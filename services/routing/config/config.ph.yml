# MOTIS v2.11.4 configuration for the national (PH-wide) routing service.
#
# Generated inside the pinned container with the binary's own generator:
#     motis config /data/osm/ph.osm.pbf /data/gtfs/ph/gtfs.zip
# then edited for this deployment only:
#   - `server.port: 8080` pins the HTTP port. `server.port` is documented in
#     MOTIS docs/setup.md ("port (default = 8080)") and in the starter configs.
#   - the generated `tiles:` block was removed: this service serves routing,
#     geocoding and timetable APIs only; map tiles are not part of the MVP and
#     the tiles import would dominate import time and memory.
#
# This is the national variant of `config.yml`. It is selected by docker-compose
# through MOTIS_CONFIG (see docker-compose.yml):
#     BIYAHEY_ROUTING_CONFIG=/etc/motis/config.ph.yml docker compose up -d routing
#
# Inputs are mounted read-only from ./data/build (see docker-compose.yml). The
# graph is written by `motis import` to the container-local /var/lib/motis/data,
# never into the read-only mount.
#
# The timetable footpath settings below are deliberately the same as the NCR
# config for now; the national tuning (extend_missing_footpaths /
# max_footpath_length) is Task 4's measured decision.
server:
  port: 8080

osm: /data/osm/ph.osm.pbf

timetable:
  first_day: TODAY
  num_days: 365
  tb: false
  railviz: true
  with_shapes: true
  adjust_footpaths: true
  merge_dupes_intra_src: false
  merge_dupes_inter_src: false
  link_stop_distance: 100
  update_interval: 60
  http_timeout: 30
  canned_rt: false
  incremental_rt_update: false
  extend_missing_footpaths: false
  max_footpath_length: 15
  default_transfer_time: 2
  max_matching_distance: 25.000000
  preprocess_max_matching_distance: 250.000000
  datasets:
    gtfs:
      path: /data/gtfs/ph/gtfs.zip
      extend_calendar: false
      default_bikes_allowed: false
      default_cars_allowed: false
      default_reservation_not_required: true
      clasz_reservation_not_required:
        AIR: false
        COACH: false
        NIGHT: false
        ODM: false
        RIDESHARING: false
elevators: false
street_routing: true
osr_footpath: false
geocoding: true
reverse_geocoding: true
